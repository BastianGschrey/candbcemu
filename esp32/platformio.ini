[env:esp32dev]
; Fest auf 7.1.3 (Stand der Firmware vom 09.10.2026): 8.0.0 bringt Arduino-Core 3.3, dessen Firmware nicht mehr
; in die 1,25-MB-App-Partition passt - und die Partitionstabelle lässt sich nur per USB ändern (löscht die DBC-Dateien).
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.embed_txtfiles = src/index.html
build_flags = -Wno-unused-variable
lib_deps =
    autowp/autowp-mcp2515@^1.2.1
    bblanchon/ArduinoJson@^7.0.0

; Over the air (after the first USB flash):  pio run -e ota -t upload
[env:ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = can-esp.local
upload_flags = --auth=cansender
